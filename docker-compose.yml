services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: math_ukglab
      POSTGRES_USER: math
      POSTGRES_PASSWORD: math
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U math -d math_ukglab"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://math:math@postgres:5432/math_ukglab?sslmode=disable
      JWT_SECRET: change-me-for-local-development
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,https://math.ukglab.com
      APP_AUTO_MIGRATE: "true"
      APP_SEED_DATABASE: "true"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
      VITE_BASE_PATH: /
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
